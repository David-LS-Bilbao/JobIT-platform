# docker-compose.staging.yml — CONTRATO CANÓNICO del staging sintético de JobIT.
#
# Fase C (bloque 2). Sustituye al compose de smoke local del Sprint 20.2: este
# fichero ya NO es un harness de validación local, es el contrato del entorno.
# El ensayo local vive en `docker-compose.staging.rehearsal.yml`.
#
# CONTRATO
#   - Ningún servicio publica puertos al host: ni PostgreSQL, ni la API, ni la
#     Web. El único punto expuesto será Nginx Proxy Manager, que en la fase D se
#     une a la red `jobit-staging` y alcanza a los contenedores por su hostname
#     interno. Publicar un puerto convertiría un descuido de firewall en una
#     superficie pública.
#   - Sin `build:`. Las imágenes se construyen en un paso explícito y auditable
#     (runbook §9) y se referencian por un tag INMUTABLE. Con `build:` presente,
#     `docker compose up` reutiliza en silencio una imagen previa o construye sin
#     supervisión: exactamente el riesgo de las imágenes de hace semanas que hoy
#     viven en el host del operador.
#   - Toda variable obligatoria usa interpolación fail-closed `${VAR:?...}`: sin
#     `--env-file`, `docker compose config` FALLA en lugar de arrancar con
#     valores de relleno. El compose anterior llevaba dummies `change_me`
#     literales, de modo que el `--env-file` del runbook era inerte y un deploy
#     habría arrancado con secretos de ejemplo.
#
# USO (los valores reales viven en el VPS, fuera del repo):
#   docker compose --env-file /srv/jobit-staging/.env \
#     -f docker-compose.staging.yml up -d
#
# MIGRACIONES Y SEED: nunca automáticos y nunca en el arranque del contenedor.
# Son pasos explícitos y gated del protocolo de deploy, con backup previo
# obligatorio (ADR-0012, runbook §10). La imagen runtime de la API no incluye la
# CLI de Prisma: se usa el stage `builder` del mismo Dockerfile.

name: jobit-staging

# --- Contrato de BUILD de la web (NO son variables de runtime) ----------------
# Las `NEXT_PUBLIC_*` se INLINEAN durante `next build`: añadirlas al entorno del
# contenedor no cambia el bundle. Se declaran aquí, en un campo de extensión que
# el runtime ignora, por una razón concreta: el MISMO `--env-file` alimenta el
# comando de build del runbook, y así `docker compose config` falla pronto si
# alguna falta, en vez de descubrirse con una imagen ya horneada contra la URL
# equivocada.
x-web-build-contract:
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required (build-arg de la imagen web)}
  NEXT_PUBLIC_PUBLIC_BASE_URL: ${NEXT_PUBLIC_PUBLIC_BASE_URL:?NEXT_PUBLIC_PUBLIC_BASE_URL is required (build-arg de la imagen web)}
  NEXT_PUBLIC_JOBIT_DATA_MODE: ${NEXT_PUBLIC_JOBIT_DATA_MODE:?NEXT_PUBLIC_JOBIT_DATA_MODE is required (build-arg de la imagen web)}

services:
  jobit-staging-db:
    image: postgres:16
    container_name: jobit-staging-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - jobit-staging-db-data:/var/lib/postgresql/data
    networks:
      - jobit-staging
    # Sin `ports:`: la DB jamás se expone fuera de la red interna (ADR-0012).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jobit-staging-api:
    # Tag inmutable (SHA del commit desplegado). Nunca `latest` ni un tag móvil:
    # un tag móvil hace que «reiniciar» y «desplegar» dejen de ser distinguibles.
    image: jobit-api:${JOBIT_IMAGE_TAG:?JOBIT_IMAGE_TAG is required (SHA de commit inmutable)}
    container_name: jobit-staging-api
    depends_on:
      jobit-staging-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      # Saltos de proxy de confianza. En staging vale 1: un único salto de Nginx
      # Proxy Manager. Sin él, el rate limiting identificaría a todos los
      # clientes por la IP del proxy; con un valor mayor, `X-Forwarded-For`
      # permitiría falsificar la IP. NUNCA `true`.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?TRUST_PROXY_HOPS is required (1 tras un unico salto de NPM)}
      # Contrato de datos sintéticos. La API ABORTA el arranque si el destino
      # clasifica STAGING y esta variable no vale exactamente SYNTHETIC_STAGING.
      JOBIT_DATA_MODE: ${JOBIT_DATA_MODE:?JOBIT_DATA_MODE is required (SYNTHETIC_STAGING en staging sintetico)}
    volumes:
      # Único estado en disco de la API (avatares); incluido en backups.
      - jobit-staging-api-uploads:/repo/apps/api/uploads
    networks:
      - jobit-staging
    # Sin `ports:`: NPM llega por la red interna a jobit-staging-api:4000.
    healthcheck:
      # READINESS, no liveness: `/health` responde 200 aunque PostgreSQL esté
      # caído, así que usarlo aquí marcaría `healthy` una API incapaz de servir
      # y el `depends_on` de la web no significaría nada.
      # La imagen no trae curl; Node 20 tiene fetch global.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jobit-staging-web:
    image: jobit-web:${JOBIT_IMAGE_TAG:?JOBIT_IMAGE_TAG is required (SHA de commit inmutable)}
    container_name: jobit-staging-web
    depends_on:
      jobit-staging-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - jobit-staging
    # Sin `ports:`: NPM llega por la red interna a jobit-staging-web:3000.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Red estable y con nombre fijo. En la fase D, Nginx Proxy Manager se une a
  # ella (`docker network connect jobit-staging <contenedor-npm>`) y enruta por
  # hostname interno. La fase C NO ejecuta esa conexión ni valida TLS.
  jobit-staging:
    name: jobit-staging

volumes:
  jobit-staging-db-data:
    name: jobit-staging-db-data
  jobit-staging-api-uploads:
    name: jobit-staging-api-uploads
